name: Publish CLI

# Publishes @auis/cli, the package that backs `npx @auis/cli`.
# Manual on purpose: the app in this repository is never published, only
# packages/cli.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: CLI tests
        run: node --test packages/cli/test/*.test.mjs

      - name: Publish @auis/cli
        working-directory: packages/cli
        run: npm publish --provenance ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
