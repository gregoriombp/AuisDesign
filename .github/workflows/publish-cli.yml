name: Publish CLI

# Publishes the installer packages that back `npx auis@latest`.
# Manual on purpose: the app in this repository is never published, only
# packages/auis and its packages/create-auis alias.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options:
          - auis
          - create-auis
        default: auis
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: CLI tests
        run: node --test packages/auis/test/*.test.mjs

      - name: Publish ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: npm publish --access public --provenance ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
