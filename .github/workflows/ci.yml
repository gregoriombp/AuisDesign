name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The app and the full suite. Node 22 because `npm test` type-strips the .ts
  # tests, which needs --experimental-strip-types (22.6+). Node 20 could not run
  # them, which is why they had never run here.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # The kit as an app would install it: built to dist/, loaded from
      # node_modules through each package's exports, with Node's own resolver.
      - name: Kit packages build and load
        run: npm run kit:smoke

      - name: Design-system check
        run: npm run ds:check
        continue-on-error: true # informational: reports hardcode debt

  # The Mac app (packages/desktop). It is its own package with its own lockfile,
  # so nothing here needs the root install. The Electron binary is not
  # downloaded: the tests cover the modules that do not import electron, and the
  # types and the bundle need the package, not the app. Linux is enough for
  # that; what only a Mac can show is checked by hand (see its PLAN.md).
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # W3 exercises the native Mac app with an isolated profile and offline fixture.
  desktop-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - name: Install desktop and Playwright
        run: npm ci
      - name: Run the built Electron app
        run: npm run smoke
      - name: Package the signed Mac app
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Same-repository code only, with identity "-" and no signing secrets.
          # electron-builder otherwise skips even ad-hoc signing in PR builds.
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run pack:mac
      - name: Verify the signed bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run verify:mac
      - name: Run the packaged Electron app
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run smoke:packaged
      - name: Keep smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: |
            packages/desktop/output/smoke
            packages/desktop/output/smoke-packaged
          retention-days: 7

  # The CLI is what runs on other people's machines, and packages/auis declares
  # engines.node ">=20". This job holds that floor: no type stripping here, so
  # it is the same Node someone on the minimum would use.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: CLI tests
        run: npm run test:cli

      - name: Scaffold a throwaway project
        run: |
          node packages/auis/bin/auis.mjs "$RUNNER_TEMP/auis-probe" --no-install --no-git
          test -f "$RUNNER_TEMP/auis-probe/AGENTS.md"
          test ! -e "$RUNNER_TEMP/auis-probe/CONTRIBUTING.md"
          test ! -e "$RUNNER_TEMP/auis-probe/packages"

      - name: Doctor reads it and writes nothing
        run: |
          fingerprint() { (cd "$1" && find . -type f -exec shasum {} + | sort | shasum); }
          before=$(fingerprint "$RUNNER_TEMP/auis-probe")
          node packages/auis/bin/auis.mjs doctor "$RUNNER_TEMP/auis-probe"
          node packages/auis/bin/auis.mjs doctor "$RUNNER_TEMP/auis-probe" --json > /dev/null
          after=$(fingerprint "$RUNNER_TEMP/auis-probe")
          test "$before" = "$after" || { echo "doctor modified the repository"; exit 1; }
