name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The Mac supervisor owns real process groups; exercise that lifecycle on macOS.
  # Desktop stays an independent install, so the root never downloads Electron.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/desktop/package-lock.json
      - name: Install shared renderer dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix packages/desktop
      - name: Desktop typecheck
        run: npm --prefix packages/desktop run typecheck
      - name: Desktop tests
        run: npm --prefix packages/desktop test
      - name: Desktop build
        run: npm --prefix packages/desktop run build

  # The app and the full suite. Node 22 because `npm test` type-strips the .ts
  # tests, which needs --experimental-strip-types (22.6+). Node 20 could not run
  # them, which is why they had never run here.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # The kit as an app would install it: built to dist/, loaded from
      # node_modules through each package's exports, with Node's own resolver.
      - name: Kit packages build and load
        run: npm run kit:smoke

      - name: Design-system check
        run: npm run ds:check
        continue-on-error: true # informational: reports hardcode debt

  # The CLI is what runs on other people's machines, and packages/auis declares
  # engines.node ">=20". This job holds that floor: no type stripping here, so
  # it is the same Node someone on the minimum would use.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: CLI tests
        run: npm run test:cli

      - name: Scaffold a throwaway project
        run: |
          node packages/auis/bin/auis.mjs "$RUNNER_TEMP/auis-probe" --no-install --no-git
          test -f "$RUNNER_TEMP/auis-probe/AGENTS.md"
          test ! -e "$RUNNER_TEMP/auis-probe/CONTRIBUTING.md"
          test ! -e "$RUNNER_TEMP/auis-probe/packages"

      - name: Doctor reads it and writes nothing
        run: |
          fingerprint() { (cd "$1" && find . -type f -exec shasum {} + | sort | shasum); }
          before=$(fingerprint "$RUNNER_TEMP/auis-probe")
          node packages/auis/bin/auis.mjs doctor "$RUNNER_TEMP/auis-probe"
          node packages/auis/bin/auis.mjs doctor "$RUNNER_TEMP/auis-probe" --json > /dev/null
          after=$(fingerprint "$RUNNER_TEMP/auis-probe")
          test "$before" = "$after" || { echo "doctor modified the repository"; exit 1; }
